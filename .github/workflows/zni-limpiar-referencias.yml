name: ZNI - retiro puntual de referencias academicas
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/zni-limpiar-referencias.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Actualizar textos visibles sin alterar el simulador
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('desalinizacion-zni/index.html')
          s = p.read_text(encoding='utf-8')
          changes = [
              ('Enrique Villa Pérez · Grupo 58<br>Ingeniería de Sistemas', 'Enrique Villa Pérez'),
              ('Prototipo ZNI · Proyecto de Ingeniería II · Grupo 58 · Datos exclusivamente virtuales', 'Prototipo ZNI · Datos exclusivamente virtuales'),
              ('Responsable: Enrique Villa Pérez, grupo 58.', 'Responsable: Enrique Villa Pérez.'),
          ]
          for before, after in changes:
              n = s.count(before)
              if n != 1:
                  raise RuntimeError(f'Coincidencias no esperadas ({n}): {before}')
              s = s.replace(before, after)
          for term in ('Grupo 58', 'Ingeniería de Sistemas', 'Proyecto de Ingeniería II'):
              if term.casefold() in s.casefold():
                  raise RuntimeError(f'Quedó referencia: {term}')
          p.write_text(s, encoding='utf-8')
          print('Cambio puntual ejecutado; tres ubicaciones corregidas.')
          PY
      - name: Confirmar cambios en el archivo original
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- desalinizacion-zni/index.html
          git commit -m "chore(zni): retirar afiliaciones de interfaz y reporte exportable"
          git push origin master
